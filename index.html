<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase Coffee - 市集預點與候位系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/30 text-stone-800 font-sans min-h-screen pb-20">

    <!-- 頂部導覽列 -->
    <header class="bg-stone-900 text-stone-100 py-4 px-4 shadow-md sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wider text-amber-100">☕ PHASE COFFEE</h1>
                <p class="text-xs text-stone-400">市集現場預點 & 即時叫號系統</p>
            </div>
            <button id="toggle-view-btn" onclick="toggleView()" class="text-xs bg-stone-800 hover:bg-stone-700 text-amber-200 border border-stone-700 px-3 py-2 rounded-lg transition font-medium shadow-sm">
                🔐 店主後台入口
            </button>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-5">

        <!-- ================= 顧客端介面 ================= -->
        <section id="customer-view" class="space-y-5">
            
            <!-- 📢 現場叫號即時看板 -->
            <div class="bg-stone-900 text-stone-100 rounded-2xl p-5 shadow-lg border border-amber-950/40 text-center relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-20 h-20 bg-amber-500/10 rounded-full blur-xl"></div>
                <div class="flex justify-between items-center mb-3 border-b border-stone-800 pb-2">
                    <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">Live Status 現場叫號看板</span>
                    <button onclick="fetchLatestStatus()" class="text-xs bg-stone-800 hover:bg-stone-700 text-stone-300 px-2.5 py-1 rounded-full border border-stone-700">
                        🔄 刷新狀態
                    </button>
                </div>
                
                <div class="grid grid-cols-2 gap-3 my-2">
                    <div class="bg-stone-800/80 p-3 rounded-xl border border-amber-500/30">
                        <div class="text-xs text-amber-300/80 font-medium mb-1">📢 目前叫號</div>
                        <div class="text-2xl font-extrabold text-amber-400 tracking-wider" id="disp-calling">準備中</div>
                    </div>
                    <div class="bg-stone-800/80 p-3 rounded-xl border border-stone-700">
                        <div class="text-xs text-stone-400 font-medium mb-1">✅ 最新可取餐</div>
                        <div class="text-lg font-bold text-emerald-400 truncate" id="disp-completed">無</div>
                    </div>
                </div>
                <p class="text-[11px] text-stone-400 mt-2">💡 請留意現場叫號，若過號請主動告知現場工作人員。</p>
            </div>

            <!-- 1. 基本候位與備註資料 -->
            <div class="bg-white rounded-2xl shadow-sm p-5 border border-stone-200">
                <h2 class="text-base font-bold mb-4 pb-2 border-b border-stone-100 text-stone-900 flex items-center gap-2">
                    <span class="bg-stone-900 text-white w-6 h-6 rounded-full inline-flex justify-center items-center text-xs">1</span>
                    填寫基本資料
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-stone-600 mb-1">姓名 / 暱稱 *</label>
                        <input type="text" id="cust-name" placeholder="例如：陳小姐" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-stone-600 mb-1">電話號碼 *</label>
                            <input type="tel" id="cust-phone" placeholder="0912345678" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-stone-600 mb-1">用餐/候位人數</label>
                            <select id="cust-people" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="1">1 人</option>
                                <option value="2" selected>2 人</option>
                                <option value="3">3 人</option>
                                <option value="4">4 人以上</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-stone-600 mb-1">特殊調配 / 備註</label>
                        <input type="text" id="cust-note" placeholder="例如：去冰、半糖、牛奶改燕麥奶..." class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>
            </div>

            <!-- 2. 菜單點餐 -->
            <div class="bg-white rounded-2xl shadow-sm p-5 border border-stone-200">
                <h2 class="text-base font-bold mb-4 pb-2 border-b border-stone-100 text-stone-900 flex items-center gap-2">
                    <span class="bg-stone-900 text-white w-6 h-6 rounded-full inline-flex justify-center items-center text-xs">2</span>
                    選擇預訂餐點
                </h2>
                
                <div class="space-y-3" id="menu-container">
                    <div class="flex items-center justify-between p-3 rounded-xl border border-stone-100 bg-stone-50/50 hover:border-amber-200 transition gap-2">
                        <div class="flex items-center space-x-3 min-w-0">
                            <div class="w-12 h-12 shrink-0 rounded-xl bg-amber-100 flex items-center justify-center text-2xl shadow-inner">☕</div>
                            <div class="truncate">
                                <div class="font-bold text-sm text-stone-800 truncate">單品手沖咖啡</div>
                                <div class="text-xs text-amber-700 font-medium">NT$ 150 / 杯</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <button onclick="updateQty('item-1', -1)" class="w-8 h-8 rounded-lg bg-stone-200 text-stone-700 font-bold hover:bg-stone-300">-</button>
                            <span id="qty-item-1" class="w-6 text-center font-bold text-sm">0</span>
                            <button onclick="updateQty('item-1', 1)" class="w-8 h-8 rounded-lg bg-stone-900 text-white font-bold hover:bg-stone-800">+</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between p-3 rounded-xl border border-stone-100 bg-stone-50/50 hover:border-amber-200 transition gap-2">
                        <div class="flex items-center space-x-3 min-w-0">
                            <div class="w-12 h-12 shrink-0 rounded-xl bg-amber-100 flex items-center justify-center text-2xl shadow-inner">🥛</div>
                            <div class="truncate">
                                <div class="font-bold text-sm text-stone-800 truncate">義式拿鐵 / 美式</div>
                                <div class="text-xs text-amber-700 font-medium">NT$ 130 / 杯</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <button onclick="updateQty('item-2', -1)" class="w-8 h-8 rounded-lg bg-stone-200 text-stone-700 font-bold hover:bg-stone-300">-</button>
                            <span id="qty-item-2" class="w-6 text-center font-bold text-sm">0</span>
                            <button onclick="updateQty('item-2', 1)" class="w-8 h-8 rounded-lg bg-stone-900 text-white font-bold hover:bg-stone-800">+</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between p-3 rounded-xl border border-stone-100 bg-stone-50/50 hover:border-amber-200 transition gap-2">
                        <div class="flex items-center space-x-3 min-w-0">
                            <div class="w-12 h-12 shrink-0 rounded-xl bg-amber-100 flex items-center justify-center text-2xl shadow-inner">🧊</div>
                            <div class="truncate">
                                <div class="font-bold text-sm text-stone-800 truncate">燕麥奶冷萃</div>
                                <div class="text-xs text-amber-700 font-medium">NT$ 140 / 杯</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <button onclick="updateQty('item-3', -1)" class="w-8 h-8 rounded-lg bg-stone-200 text-stone-700 font-bold hover:bg-stone-300">-</button>
                            <span id="qty-item-3" class="w-6 text-center font-bold text-sm">0</span>
                            <button onclick="updateQty('item-3', 1)" class="w-8 h-8 rounded-lg bg-stone-900 text-white font-bold hover:bg-stone-800">+</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between p-3 rounded-xl border border-stone-100 bg-stone-50/50 hover:border-amber-200 transition gap-2">
                        <div class="flex items-center space-x-3 min-w-0">
                            <div class="w-12 h-12 shrink-0 rounded-xl bg-amber-100 flex items-center justify-center text-2xl shadow-inner">🍰</div>
                            <div class="truncate">
                                <div class="font-bold text-sm text-stone-800 truncate">焦糖巴斯克蛋糕</div>
                                <div class="text-xs text-amber-700 font-medium">NT$ 120 / 塊</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <button onclick="updateQty('item-4', -1)" class="w-8 h-8 rounded-lg bg-stone-200 text-stone-700 font-bold hover:bg-stone-300">-</button>
                            <span id="qty-item-4" class="w-6 text-center font-bold text-sm">0</span>
                            <button onclick="updateQty('item-4', 1)" class="w-8 h-8 rounded-lg bg-stone-900 text-white font-bold hover:bg-stone-800">+</button>
                        </div>
                    </div>
                </div>

                <div class="mt-5 pt-3 border-t border-stone-200 flex justify-between items-center font-bold">
                    <span class="text-stone-600 text-sm">預估總金額：</span>
                    <span class="text-xl text-stone-900 font-black" id="total-price">NT$ 0</span>
                </div>
            </div>

            <!-- 送出按鈕 -->
            <button id="submit-btn" onclick="submitOrder()" class="w-full bg-stone-900 hover:bg-stone-800 active:scale-[0.99] text-amber-100 font-bold py-4 rounded-2xl shadow-lg transition duration-200 text-base tracking-wide">
                確認送出預訂單
            </button>
        </section>

        <!-- ================= 店家後台介面 ================= -->
        <section id="admin-view" class="hidden space-y-4">
            
            <div class="bg-amber-100/60 border border-amber-300/60 rounded-xl p-3 flex justify-between items-center text-xs text-amber-900">
                <span class="font-bold">🔐 已進入店主管理模式 (密碼：8888)</span>
                <button onclick="lockAdmin()" class="bg-amber-200 hover:bg-amber-300 px-2.5 py-1 rounded font-bold text-amber-900">退出後台</button>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white p-3 rounded-xl border border-stone-200 text-center shadow-sm">
                    <div class="text-[11px] text-stone-500 font-bold mb-1">等待處理</div>
                    <div class="text-xl font-black text-amber-600" id="stat-pending">0</div>
                </div>
                <div class="bg-white p-3 rounded-xl border border-stone-200 text-center shadow-sm">
                    <div class="text-[11px] text-stone-500 font-bold mb-1">已叫號準備</div>
                    <div class="text-xl font-black text-blue-600" id="stat-calling">0</div>
                </div>
                <div class="bg-white p-3 rounded-xl border border-stone-200 text-center shadow-sm">
                    <div class="text-[11px] text-stone-500 font-bold mb-1">今日已完成</div>
                    <div class="text-xl font-black text-emerald-600" id="stat-completed">0</div>
                </div>
            </div>

            <div class="flex justify-between items-center pt-2">
                <h2 class="text-lg font-bold text-stone-900">即時訂單動態清單</h2>
                <button onclick="fetchOrdersFromSheet()" class="text-xs bg-stone-800 text-white hover:bg-stone-700 px-3 py-1.5 rounded-lg font-bold">
                    🔄 刷新訂單
                </button>
            </div>

            <div id="order-list" class="space-y-3">
                <div class="text-center py-8 text-stone-400">讀取資料中...</div>
            </div>
        </section>

    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEXPhlLXfyQpaxeB-1ADSdWemihBx6FNb6bYkwi-oE-JoA74lHQoAxvGOgS9cLSowA/exec";
        const ADMIN_PASSWORD = "8888";
        let isAdminUnlocked = false;
        let globalOrders = [];

        const itemsData = {
            'item-1': { name: '單品手沖咖啡', price: 150, qty: 0 },
            'item-2': { name: '義式拿鐵 / 美式', price: 130, qty: 0 },
            'item-3': { name: '燕麥奶冷萃', price: 140, qty: 0 },
            'item-4': { name: '焦糖巴斯克蛋糕', price: 120, qty: 0 }
        };

        function updateQty(itemId, delta) {
            const item = itemsData[itemId];
            if (!item) return;
            item.qty = Math.max(0, item.qty + delta);
            document.getElementById(`qty-${itemId}`).innerText = item.qty;
            let total = 0;
            Object.values(itemsData).forEach(i => total += i.price * i.qty);
            document.getElementById('total-price').innerText = `NT$ ${total}`;
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const people = document.getElementById('cust-people').value;
            const note = document.getElementById('cust-note').value.trim();

            if (!name || !phone) { alert('請填寫姓名與電話！'); return; }

            const itemsSummary = Object.values(itemsData)
                .filter(i => i.qty > 0)
                .map(i => `${i.name} x${i.qty}`)
                .join(', ');

            if (!itemsSummary) { alert('請至少選擇一項餐點！'); return; }

            let total = 0;
            Object.values(itemsData).forEach(i => total += i.price * i.qty);

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = '正在傳送預訂單...';

            const orderId = '#' + Math.floor(1000 + Math.random() * 9000);
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const orderPayload = {
                id: orderId,
                time: timeStr,
                name: name,
                phone: phone,
                people: people,
                items: itemsSummary + (note ? ` [備註: ${note}]` : ''),
                total: total,
                status: '等待中' // 預設狀態
            };

            try {
                if (GOOGLE_SCRIPT_URL) {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderPayload)
                    });
                }
                alert(`預訂成功！您的專屬單號為：${orderId}\n請留意頂部看板現場叫號！`);
                document.getElementById('cust-name').value = '';
                document.getElementById('cust-phone').value = '';
                document.getElementById('cust-note').value = '';
                Object.keys(itemsData).forEach(key => {
                    itemsData[key].qty = 0;
                    document.getElementById(`qty-${key}`).innerText = '0';
                });
                document.getElementById('total-price').innerText = 'NT$ 0';
                fetchLatestStatus();
            } catch (err) {
                alert('傳送失敗，請稍後再試！');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出預訂單';
            }
        }

        function toggleView() {
            const custView = document.getElementById('customer-view');
            const adminView = document.getElementById('admin-view');
            const btn = document.getElementById('toggle-view-btn');

            if (adminView.classList.contains('hidden')) {
                if (!isAdminUnlocked) {
                    const pwd = prompt("請輸入店主管理密碼（預設：8888）：");
                    if (pwd !== ADMIN_PASSWORD) {
                        alert("密碼錯誤！無法進入後台。");
                        return;
                    }
                    isAdminUnlocked = true;
                }
                custView.classList.add('hidden');
                adminView.classList.remove('hidden');
                btn.innerText = '返回顧客點餐';
                fetchOrdersFromSheet();
            } else {
                custView.classList.remove('hidden');
                adminView.classList.add('hidden');
                btn.innerText = '🔐 店主後台入口';
                fetchLatestStatus();
            }
        }

        function lockAdmin() {
            isAdminUnlocked = false;
            toggleView();
        }

        async function fetchOrdersFromSheet() {
            const listContainer = document.getElementById('order-list');
            listContainer.innerHTML = '<div class="text-center py-8 text-stone-400">連線試算表中...</div>';

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();

                if (data.status === 'success' && data.orders.length > 0) {
                    globalOrders = data.orders;
                    renderAdminList();
                } else {
                    listContainer.innerHTML = '<div class="text-center py-8 text-stone-400">目前尚無預訂訂單</div>';
                }
            } catch (err) {
                listContainer.innerHTML = '<div class="text-center py-8 text-red-400">無法載入試算表資料</div>';
            }
        }

        async function fetchLatestStatus() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                if (data.status === 'success' && data.orders.length > 0) {
                    const callingOrders = data.orders.filter(o => o.status === '叫號中').map(o => o.id);
                    const completedOrders = data.orders.filter(o => o.status === '已完成').map(o => o.id);

                    document.getElementById('disp-calling').innerText = callingOrders.length > 0 ? callingOrders.join(', ') : '準備中';
                    document.getElementById('disp-completed').innerText = completedOrders.length > 0 ? completedOrders.slice(-3).join(', ') : '無';
                }
            } catch(e) {}
        }

        function renderAdminList() {
            const listContainer = document.getElementById('order-list');
            let pending = 0, calling = 0, completed = 0;

            listContainer.innerHTML = globalOrders.slice().reverse().map((o, index) => {
                const status = o.status || '等待中';
                if (status === '等待中') pending++;
                if (status === '叫號中') calling++;
                if (status === '已完成') completed++;

                let borderClass = 'border-stone-200';
                let badgeHtml = '';
                if (status === '叫號中') {
                    borderClass = 'border-amber-500 ring-2 ring-amber-400/20';
                    badgeHtml = '<span class="text-xs bg-amber-500 text-white px-2.5 py-1 rounded-md font-bold">📢 叫號中</span>';
                } else if (status === '已完成') {
                    borderClass = 'border-emerald-300 opacity-60';
                    badgeHtml = '<span class="text-xs bg-emerald-600 text-white px-2.5 py-1 rounded-md font-bold">✅ 已完成</span>';
                }

                // 計算原始陣列正確的索引
                const originalIndex = globalOrders.length - 1 - index;

                return `
                    <div class="bg-white p-4 rounded-xl shadow-sm border ${borderClass} transition">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-black text-lg text-stone-900">${o.id} - ${o.name} (${o.people}位)</span>
                            <span class="text-xs bg-stone-100 text-stone-500 px-2 py-1 rounded">${o.time}</span>
                        </div>
                        <div class="text-xs text-stone-700 font-medium bg-stone-50 p-2.5 rounded-lg mb-3">${o.items}</div>
                        <div class="flex justify-between items-center text-xs font-bold border-t border-stone-100 pt-2.5">
                            <span class="text-stone-600">電話: ${o.phone} | <span class="text-stone-900 font-extrabold">NT$ ${o.total}</span></span>
                            <div class="space-x-1.5" id="btn-group-${index}">
                                ${badgeHtml || `
                                    <button onclick="updateStatusOnServer(${originalIndex}, '叫號中')" class="bg-amber-100 text-amber-800 hover:bg-amber-200 px-3 py-1.5 rounded-lg font-bold transition">📢 叫號</button>
                                    <button onclick="updateStatusOnServer(${originalIndex}, '已完成')" class="bg-emerald-100 text-emerald-800 hover:bg-emerald-200 px-3 py-1.5 rounded-lg font-bold transition">✅ 完成</button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-calling').innerText = calling;
            document.getElementById('stat-completed').innerText = completed;
        }

        // 點擊叫號或完成時，透過背景同步更新狀態
        async function updateStatusOnServer(orderIndex, newStatus) {
            if (!globalOrders[orderIndex]) return;
            globalOrders[orderIndex].status = newStatus;
            renderAdminList(); // 本地畫面立刻更新

            // 同步送回後端試算表儲存
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'updateStatus',
                        rowId: globalOrders[orderIndex].id,
                        status: newStatus
                    })
                });
            } catch(e) {
                console.error("狀態同步失敗", e);
            }
        }

        setInterval(() => {
            if (isAdminUnlocked) {
                fetchOrdersFromSheet();
            } else {
                fetchLatestStatus();
            }
        }, 10000);

        fetchLatestStatus();
    </script>
</body>
</html>
